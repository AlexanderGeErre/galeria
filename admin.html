<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Alexander Ge Erre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--f:#FAF8F5;--t:#2B2623;--s:#7a7068;--l:#E6DFD6;--a:#B08968;--p:#F3EFE9}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--f);color:var(--t);font-family:'Jost',system-ui,sans-serif;line-height:1.5}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1}
h1{font-size:2.2rem}h2{font-size:1.5rem}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
.btn{background:var(--t);color:var(--f);border:1px solid var(--t);padding:.55rem 1.1rem;border-radius:2px;text-decoration:none;display:inline-block}
.btn.sec{background:none;color:var(--t);border-color:var(--l)}
input[type=text],input[type=password],select{width:100%;padding:.65rem .85rem;border:1px solid var(--l);background:var(--f);border-radius:2px}
.s{color:var(--s);font-size:.9rem}
.ilus{mix-blend-mode:multiply;filter:contrast(1.04) brightness(1.05);max-width:100%;display:block}
#login{max-width:22rem;margin:8vh auto 0;padding:1rem;display:flex;flex-direction:column;gap:.8rem;text-align:center}
#login .ilus{width:11rem;margin:0 auto}
.err{color:#b5453f;font-size:.95rem}
#app{display:grid;grid-template-columns:220px 1fr;min-height:100vh}
aside{background:var(--p);border-right:1px solid var(--l);padding:1.4rem 1rem;display:flex;flex-direction:column;gap:.3rem;position:sticky;top:0;height:100vh}
aside .marca{font-family:'Cormorant Garamond',serif;font-size:1.35rem;margin-bottom:1.2rem}
aside button{background:none;border:0;text-align:left;padding:.55rem .7rem;border-radius:2px;color:var(--s)}
aside button.on{background:var(--l);color:var(--t)}
aside .pie{margin-top:auto}
main{padding:2rem clamp(1rem,4vw,3rem);max-width:1100px;width:100%}
.fila{display:flex;gap:.7rem;flex-wrap:wrap;align-items:center;margin:1rem 0}
.fila input[type=text]{flex:1;min-width:12rem}.fila select{width:auto}
.cifras{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));border:1px solid var(--l);border-radius:3px;margin:.6rem 0 1.6rem}
.cifras div{padding:1rem 1.2rem;border-right:1px solid var(--l)}.cifras div:last-child{border:0}
.cifras b{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:500;display:block;line-height:1.1}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.tar{background:none;border:0;text-align:left;padding:0}
.tar .cv{aspect-ratio:3/2;background:var(--l);border-radius:2px;overflow:hidden;display:grid;place-items:center}
.tar .cv>img{width:100%;height:100%;object-fit:cover}
.tar .cv .ilus{width:45%;mix-blend-mode:normal;filter:none}
.tar.nuevo .cv{border:1px dashed var(--s);background:none;font-size:2rem;color:var(--s)}
.tar h3{font-size:1.15rem;margin-top:.5rem;text-transform:uppercase;letter-spacing:.06em;font-family:'Jost',sans-serif;font-size:.85rem;font-weight:500}
.pill{display:inline-block;border:1px solid var(--a);border-radius:999px;padding:0 .65rem;font-size:.8rem;margin-top:.2rem}
.card{border:1px solid var(--l);border-radius:3px;padding:1.2rem;margin:.6rem 0 1.4rem}
.vacio{display:flex;align-items:center;gap:1.2rem;flex-wrap:wrap}.vacio .ilus{width:7rem}
.tabs{display:flex;gap:1.4rem;border-bottom:1px solid var(--l);margin:1rem 0}
.tabs button{background:none;border:0;padding:.5rem 0;color:var(--s);border-bottom:2px solid transparent}
.tabs button.on{color:var(--t);border-color:var(--a)}
.copia{display:flex;gap:.5rem;margin:.4rem 0 1rem}.copia input{flex:1}
.lado{display:flex;gap:1.5rem;align-items:center;flex-wrap:wrap}.lado .ilus{width:14rem}
dialog{border:1px solid var(--l);background:var(--f);color:var(--t);border-radius:4px;padding:1.4rem;width:min(30rem,92vw);margin:auto}
dialog::backdrop{background:rgba(43,38,35,.5)}
dialog h2{margin-bottom:.8rem}dialog form,.col{display:flex;flex-direction:column;gap:.7rem}
textarea{width:100%;height:10rem;background:none;border:1px solid var(--l);padding:.6rem;border-radius:2px;font:inherit}
#prog{list-style:none;padding:0;max-height:12rem;overflow:auto;font-size:.9rem}
@media(max-width:760px){#app{grid-template-columns:1fr}aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center}aside .marca{margin:0 1rem 0 0}aside .pie{margin:0 0 0 auto}}
</style>
</head>
<body>

<main id="login">
  <div id="ilAcceso"></div>
  <h1>Panel de galerías</h1>
  <input id="clave" type="password" placeholder="Clave de administrador" autocomplete="current-password">
  <p class="err" id="errLogin" hidden></p>
  <button class="btn" id="entrar" type="button">Entrar</button>
</main>

<div id="app" hidden>
  <aside>
    <div class="marca">Alexander Ge Erre</div>
    <button data-v="inicio" class="on">Inicio</button>
    <button data-v="galerias">Galerías de clientes</button>
    <div class="pie"><button id="salir" type="button">Salir</button></div>
  </aside>
  <main id="vista"></main>
</div>

<dialog id="dNueva">
  <h2>Nueva galería</h2>
  <form id="fNueva">
    <input id="nCliente" type="text" placeholder="Cliente (ej. Ana y Luis)" required>
    <input id="nTitulo" type="text" placeholder="Nombre de la galería (ej. Boda Ana y Luis)">
    <select id="nOcasion"></select>
    <div><button class="btn" type="submit">Crear</button> <button class="btn sec" type="button" data-cerrar>Cancelar</button></div>
  </form>
</dialog>

<dialog id="dSubir">
  <h2 id="tSubir">Subir fotos</h2>
  <div class="col">
    <label><input type="radio" name="dest" value="seleccion" checked> Selección (se reducen a 1600 px)</label>
    <label><input type="radio" name="dest" value="finales"> Finales (originales, hasta 12 MB cada una)</label>
    <input id="archivos" type="file" accept="image/*" multiple>
    <ul id="prog"></ul>
    <div><button class="btn" id="goSubir" type="button">Subir</button> <button class="btn sec" type="button" data-cerrar>Cerrar</button></div>
  </div>
</dialog>

<dialog id="dFav">
  <h2>Favoritas del cliente</h2>
  <div class="col">
    <textarea id="txtFav" readonly></textarea>
    <div><button class="btn" id="copiar" type="button">Copiar</button> <button class="btn sec" type="button" data-cerrar>Cerrar</button></div>
  </div>
</dialog>

<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycby23djlrjkanNYq62DS3HKVv9PCfFoU32mojjjcThKr00AK7EHKQuWE5mVQoMHBdBbA/exec';
  var BASE = 'https://alexandergeerre.github.io/galeria/';
  var OCASIONES = ['General','Boda','Graduación','Maternidad','Quinceañera','Bautizo','Cumpleaños','Familia'];
  var ESTADOS = ['En selección','Selección enviada','Entregada'];
  var EXT = ['png','jpg','jpeg','webp'];
  var clave = ''; try { clave = localStorage.getItem('age-clave') || ''; } catch(e) {}
  var galerias = [], vista = 'inicio', galId = null, tab = 'panel', busca = '', fEstado = '', fOcasion = '';
  function $(s){ return document.querySelector(s); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function ilus(n){ return '<img class="ilus" data-n="' + n + '" data-i="0" src="imagenes/' + n + '.png" alt="">'; }
  document.addEventListener('error', function(e){
    var t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.n) return;
    var i = +t.dataset.i + 1;
    if (i < EXT.length) { t.dataset.i = i; t.src = 'imagenes/' + t.dataset.n + '.' + EXT[i]; } else t.style.visibility = 'hidden';
  }, true);
  function llamar(o){ o.clave = clave; return fetch(API, { method: 'POST', body: JSON.stringify(o) }).then(function(r){ return r.json(); }); }
  function pegar(sel, h){ $(sel).innerHTML = h; }
  function gal(id){ return galerias.filter(function(g){ return g.id === id; })[0]; }
  function copiarTxt(t){ try { navigator.clipboard.writeText(t); } catch(e) {} }

  function tarjeta(g){
    var cv = g.portada ? '<img src="' + esc(g.portada) + '" alt="">' : ilus('admin-sin-portada');
    return '<button class="tar" data-abrir="' + esc(g.id) + '"><div class="cv">' + cv + '</div><h3>' + esc(g.titulo) + '</h3><p class="s">' + esc(g.fecha) + '</p><span class="pill">' + esc(g.estado) + '</span></button>';
  }

  function pintar(){
    document.querySelectorAll('aside [data-v]').forEach(function(b){ b.classList.toggle('on', b.dataset.v === vista); });
    if (vista === 'inicio') return pintarInicio();
    if (vista === 'galerias') return pintarLista();
    pintarDetalle();
  }

  function pintarInicio(){
    var ent = galerias.filter(function(g){ return g.estado === 'Entregada'; }).length;
    var v = 0, f = 0; galerias.forEach(function(g){ v += g.vistas; f += g.favoritas; });
    var pend = galerias.filter(function(g){ return g.estado === 'Selección enviada'; });
    var act = pend.length ? pend.map(function(g){ return '<p><button class="btn sec" data-abrir="' + esc(g.id) + '">' + esc(g.titulo) + '</button> envió ' + g.favoritas + ' favoritas</p>'; }).join('')
      : '<div class="vacio">' + ilus('admin-al-dia') + '<div><b>Todo al día</b><p class="s">No hay selecciones nuevas por revisar.</p></div></div>';
    pegar('#vista', '<h1>Bienvenido, Alexander</h1>' +
      '<div class="fila"><input id="bq" type="text" placeholder="Buscar galerías"><button class="btn" data-nueva>+ Crear galería</button></div>' +
      '<h2>Resumen</h2><div class="cifras"><div><b>' + galerias.length + '</b><span class="s">Galerías</span></div><div><b>' + ent + '</b><span class="s">Entregadas</span></div><div><b>' + v + '</b><span class="s">Vistas</span></div><div><b>' + f + '</b><span class="s">Favoritas</span></div></div>' +
      '<h2>Actividad reciente</h2><div class="card">' + act + '</div>' +
      '<h2>Galerías recientes</h2><div class="rej" style="margin-top:.8rem">' + galerias.slice(-4).reverse().map(tarjeta).join('') + '</div>');
    $('#bq').addEventListener('keydown', function(e){ if (e.key === 'Enter') { busca = e.target.value; vista = 'galerias'; pintar(); } });
  }

  function pintarLista(){
    var l = galerias.filter(function(g){
      return (!fEstado || g.estado === fEstado) && (!fOcasion || g.ocasion === fOcasion) &&
        (!busca || (g.titulo + ' ' + g.cliente).toLowerCase().indexOf(busca.toLowerCase()) >= 0);
    }).reverse();
    var opt = function(arr, sel, todos){ return '<option value="">' + todos + '</option>' + arr.map(function(x){ return '<option' + (x === sel ? ' selected' : '') + '>' + esc(x) + '</option>'; }).join(''); };
    pegar('#vista', '<h1>Galerías de clientes</h1><div class="fila"><input id="bq" type="text" placeholder="Buscar por nombre" value="' + esc(busca) + '">' +
      '<select id="fe">' + opt(ESTADOS, fEstado, 'Todos los estados') + '</select><select id="fo">' + opt(OCASIONES, fOcasion, 'Todas las ocasiones') + '</select></div>' +
      '<div class="rej"><button class="tar nuevo" data-nueva><div class="cv">+</div><h3>Agregar galería</h3></button>' + l.map(tarjeta).join('') + '</div>' +
      (galerias.length ? '' : '<div class="vacio card" style="margin-top:1.4rem">' + ilus('admin-vacio') + '<div><b>Aún no hay galerías</b><p class="s">Crea la primera con el botón de arriba.</p></div></div>'));
    $('#bq').addEventListener('input', function(e){ busca = e.target.value; pintarLista(); var q = $('#bq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); });
    $('#fe').addEventListener('change', function(e){ fEstado = e.target.value; pintarLista(); });
    $('#fo').addEventListener('change', function(e){ fOcasion = e.target.value; pintarLista(); });
  }

  function pintarDetalle(){
    var g = gal(galId); if (!g) { vista = 'galerias'; return pintar(); }
    var cuerpo = '';
    if (tab === 'panel') {
      cuerpo = '<div class="cifras"><div><b>' + g.vistas + '</b><span class="s">Vistas</span></div><div><b>' + g.favoritas + '</b><span class="s">Favoritas</span></div><div><b>' + esc(g.ocasion) + '</b><span class="s">Ocasión</span></div><div><b>' + esc(g.expira || 'Sin fecha') + '</b><span class="s">Caducidad</span></div></div>' +
        '<p class="s">Cliente: ' + esc(g.cliente) + ' · creada el ' + esc(g.fecha) + '</p>' +
        '<div class="fila"><button class="btn" data-entregar>Marcar como entregada</button><a class="btn sec" href="' + esc(g.carpeta) + '" target="_blank" rel="noopener">Abrir en Drive</a></div>';
    } else if (tab === 'fotos') {
      cuerpo = '<div class="lado">' + ilus('admin-subir') + '<div><p class="s">Sube las fotos de selección (se reducen solas) o las finales.</p><div class="fila"><button class="btn" data-subir>Subir fotos</button><button class="btn sec" data-fav>Ver favoritas</button></div></div></div>';
    } else {
      cuerpo = '<div class="lado">' + ilus('compartir-enlace') + '<div style="flex:1;min-width:15rem"><p class="s">Enlace de la galería</p><div class="copia"><input type="text" readonly value="' + esc(BASE) + '"><button class="btn sec" data-cp="' + esc(BASE) + '">Copiar</button></div>' +
        '<p class="s">Código de acceso del cliente</p><div class="copia"><input type="text" readonly value="' + esc(g.codigo) + '"><button class="btn sec" data-cp="' + esc(g.codigo) + '">Copiar</button></div></div></div>';
    }
    pegar('#vista', '<button class="btn sec" data-atras>← Galerías</button><h1 style="margin-top:1rem">' + esc(g.titulo) + '</h1><span class="pill">' + esc(g.estado) + '</span>' +
      '<div class="tabs">' + [['panel','Panel de control'],['fotos','Fotos'],['compartir','Compartir']].map(function(x){ return '<button data-tab="' + x[0] + '"' + (tab === x[0] ? ' class="on"' : '') + '>' + x[1] + '</button>'; }).join('') + '</div>' + cuerpo);
  }

  function cargar(){
    return llamar({ accion: 'lista' }).then(function(d){
      if (!d.ok) { clave = ''; try { localStorage.removeItem('age-clave'); } catch(e) {} entrarVista(false); $('#errLogin').textContent = d.error === 'bloqueado' ? 'Demasiados intentos. Espera 15 minutos.' : 'La clave no es correcta.'; $('#errLogin').hidden = false; return; }
      galerias = d.galerias; entrarVista(true); pintar();
    }).catch(function(){ entrarVista(false); $('#errLogin').textContent = 'No pude conectar. Revisa tu internet.'; $('#errLogin').hidden = false; });
  }
  function entrarVista(dentro){ $('#login').hidden = dentro; $('#app').hidden = !dentro; }

  $('#ilAcceso').innerHTML = ilus('admin-acceso');
  $('#nOcasion').innerHTML = OCASIONES.map(function(o){ return '<option>' + o + '</option>'; }).join('');
  $('#entrar').addEventListener('click', function(){ clave = $('#clave').value; try { localStorage.setItem('age-clave', clave); } catch(e) {} $('#errLogin').hidden = true; cargar(); });
  $('#clave').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#entrar').click(); });
  $('#salir').addEventListener('click', function(){ clave = ''; try { localStorage.removeItem('age-clave'); } catch(e) {} $('#clave').value = ''; entrarVista(false); });

  $('#fNueva').addEventListener('submit', function(e){
    e.preventDefault();
    llamar({ accion: 'nueva', cliente: $('#nCliente').value, titulo: $('#nTitulo').value, ocasion: $('#nOcasion').value }).then(function(d){
      $('#dNueva').close();
      if (d.ok) { $('#nCliente').value = ''; $('#nTitulo').value = ''; vista = 'galerias'; cargar(); } else alert('No se pudo crear la galería.');
    });
  });

  function reducir(file){
    return createImageBitmap(file).then(function(b){
      var k = Math.min(1, 1600 / Math.max(b.width, b.height)), c = document.createElement('canvas');
      c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
      c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
      return new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.85); });
    });
  }
  function base64(blob){ return new Promise(function(r){ var fr = new FileReader(); fr.onload = function(){ r(fr.result.split(',')[1]); }; fr.readAsDataURL(blob); }); }

  $('#goSubir').addEventListener('click', function(){
    var files = Array.from($('#archivos').files), dest = document.querySelector('input[name=dest]:checked').value;
    if (!files.length) return;
    var btn = $('#goSubir'); btn.disabled = true; $('#prog').innerHTML = '';
    var cadena = Promise.resolve();
    files.forEach(function(f){
      var li = document.createElement('li'); li.textContent = f.name + ': esperando'; $('#prog').appendChild(li);
      cadena = cadena.then(function(){
        li.textContent = f.name + ': subiendo…';
        var nombre = f.name;
        var obtener = dest === 'seleccion'
          ? reducir(f).then(function(b){ nombre = f.name.replace(/\.[^.]+$/, '') + '.jpg'; return b; })
          : (f.size > 12e6 ? Promise.reject(new Error('pesa más de 12 MB, súbela directo a Drive')) : Promise.resolve(f));
        return obtener.then(function(blob){
          return base64(blob).then(function(datos){ return llamar({ accion: 'subir', id: galId, destino: dest, nombre: nombre, tipo: blob.type || 'image/jpeg', datos: datos }); });
        }).then(function(d){ li.textContent = f.name + (d.ok ? ': lista' : ': error al guardar'); })
          .catch(function(e){ li.textContent = f.name + ': ' + (e.message || 'error'); });
      });
    });
    cadena.then(function(){ btn.disabled = false; $('#archivos').value = ''; cargar(); });
  });

  document.addEventListener('click', function(e){
    var el, t = e.target;
    if (t.closest('[data-cerrar]')) { t.closest('dialog').close(); return; }
    if ((el = t.closest('aside [data-v]'))) { vista = el.dataset.v; pintar(); return; }
    if (t.closest('[data-nueva]')) { $('#dNueva').showModal(); return; }
    if ((el = t.closest('[data-abrir]'))) { galId = el.dataset.abrir; vista = 'detalle'; tab = 'panel'; pintar(); return; }
    if (t.closest('[data-atras]')) { vista = 'galerias'; pintar(); return; }
    if ((el = t.closest('[data-tab]'))) { tab = el.dataset.tab; pintar(); return; }
    if ((el = t.closest('[data-cp]'))) { copiarTxt(el.dataset.cp); el.textContent = 'Copiado'; return; }
    if (t.closest('[data-subir]')) { var g = gal(galId); $('#tSubir').textContent = 'Subir fotos · ' + (g ? g.titulo : ''); $('#prog').innerHTML = ''; $('#dSubir').showModal(); return; }
    if (t.closest('[data-fav]')) {
      llamar({ accion: 'favoritas', id: galId }).then(function(d){
        $('#txtFav').value = d.ok ? (d.nombres.length ? d.nombres.join(', ') : 'Aún no hay favoritas.') : 'No se pudo leer.';
        $('#dFav').showModal();
      }); return;
    }
    if (t.closest('[data-entregar]')) {
      if (!confirm('¿Marcar como entregada? Se activan las descargas y se quita la marca de agua.')) return;
      llamar({ accion: 'entregar', id: galId }).then(function(){ cargar(); });
    }
  });
  $('#copiar').addEventListener('click', function(){ $('#txtFav').select(); copiarTxt($('#txtFav').value); });

  if (clave) cargar();
})();
</script>
</body>
</html>
