<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Panel · Alexander Ge Erre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--f:#FAF8F5;--t:#2B2623;--s:#6f665e;--l:#E6DFD6;--a:#B08968;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--f:#151413;--t:#F1ECE4;--s:#a39a91;--l:#2c2926;--a:#C9A27A;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
body{background:var(--f);color:var(--t);font-family:'Jost',system-ui,sans-serif;line-height:1.5;padding:1.25rem;padding-top:calc(1.25rem + env(safe-area-inset-top))}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.btn{background:var(--t);color:var(--f);border:1px solid var(--t);padding:.6rem 1.1rem;border-radius:2px}
.btn.sec{background:none;color:var(--t)}
input[type=text],input[type=password]{width:100%;padding:.7rem .9rem;border:1px solid var(--s);background:none;border-radius:2px}
.cab{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;max-width:1100px;margin:0 auto 1.25rem}
.cab h1{font-size:2.2rem}
.rej{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;max-width:1100px;margin:0 auto}
.tar{border:1px solid var(--l);border-radius:3px;padding:1rem;display:flex;flex-direction:column;gap:.5rem}
.tar h2{font-size:1.5rem}
.s{color:var(--s);font-size:.9rem}
.pill{display:inline-block;border:1px solid var(--a);border-radius:999px;padding:0 .7rem;font-size:.85rem;width:fit-content}
.acc{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.4rem}
.acc .btn{padding:.35rem .8rem;font-size:.9rem}
#login{max-width:22rem;margin:18vh auto 0;display:flex;flex-direction:column;gap:.8rem}
.err{color:#c0504d;font-size:.95rem}
dialog{border:1px solid var(--l);background:var(--f);color:var(--t);border-radius:4px;padding:1.4rem;width:min(30rem,92vw);margin:auto}
dialog::backdrop{background:rgba(21,20,19,.6)}
dialog h2{font-size:1.7rem;margin-bottom:.7rem}
dialog form,.col{display:flex;flex-direction:column;gap:.7rem}
textarea{width:100%;height:10rem;background:none;border:1px solid var(--s);padding:.6rem;border-radius:2px;color:inherit;font:inherit}
#prog{list-style:none;padding:0;max-height:12rem;overflow:auto;font-size:.9rem}
</style>
</head>
<body>

<main id="login">
  <h1>Panel de galerías</h1>
  <label class="s" for="clave">Clave de administrador</label>
  <input id="clave" type="password" autocomplete="current-password">
  <p class="err" id="errLogin" hidden></p>
  <button class="btn" id="entrar" type="button">Entrar</button>
</main>

<main id="panel" hidden>
  <div class="cab">
    <h1>Galerías</h1>
    <div><button class="btn" id="nueva" type="button">Nueva galería</button> <button class="btn sec" id="salir" type="button">Salir</button></div>
  </div>
  <div class="rej" id="rej"></div>
</main>

<dialog id="dNueva">
  <h2>Nueva galería</h2>
  <form class="col" id="fNueva">
    <input id="nCliente" type="text" placeholder="Cliente (ej. Ana y Luis)" required>
    <input id="nTitulo" type="text" placeholder="Título del evento (ej. Boda Ana y Luis)">
    <div><button class="btn" type="submit">Crear</button> <button class="btn sec" type="button" data-cerrar>Cancelar</button></div>
  </form>
</dialog>

<dialog id="dSubir">
  <h2 id="tSubir">Subir fotos</h2>
  <div class="col">
    <label><input type="radio" name="dest" value="seleccion" checked> Selección (se reducen a 1600 px)</label>
    <label><input type="radio" name="dest" value="finales"> Finales (originales, hasta 12 MB cada una)</label>
    <input id="archivos" type="file" accept="image/*" multiple>
    <ul id="prog"></ul>
    <div><button class="btn" id="goSubir" type="button">Subir</button> <button class="btn sec" type="button" data-cerrar>Cerrar</button></div>
  </div>
</dialog>

<dialog id="dFav">
  <h2>Favoritas del cliente</h2>
  <div class="col">
    <textarea id="txtFav" readonly></textarea>
    <div><button class="btn" id="copiar" type="button">Copiar</button> <button class="btn sec" type="button" data-cerrar>Cerrar</button></div>
  </div>
</dialog>

<script>
(function(){
  var API = 'https://script.google.com/macros/s/AKfycby23djlrjkanNYq62DS3HKVv9PCfFoU32mojjjcThKr00AK7EHKQuWE5mVQoMHBdBbA/exec';
  var clave = '';
  try { clave = sessionStorage.getItem('age-clave') || ''; } catch(e) {}
  var galActual = null, galerias = [];
  function $(s){ return document.querySelector(s); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function llamar(o){
    o.clave = clave;
    return fetch(API, { method: 'POST', body: JSON.stringify(o) }).then(function(r){ return r.json(); });
  }
  function ver(login){ $('#login').hidden = !login; $('#panel').hidden = login; }

  function pintar(){
    $('#rej').innerHTML = galerias.slice().reverse().map(function(g){
      return '<article class="tar"><h2>' + esc(g.titulo) + '</h2>' +
        '<p class="s">' + esc(g.cliente) + ' · ' + esc(g.fecha) + '</p>' +
        '<span class="pill">' + esc(g.estado) + '</span>' +
        '<p class="s">Código: <strong>' + esc(g.codigo) + '</strong> · ' + g.favoritas + ' favoritas</p>' +
        '<div class="acc"><button class="btn" data-subir="' + esc(g.id) + '">Subir fotos</button>' +
        '<button class="btn sec" data-fav="' + esc(g.id) + '">Favoritas</button>' +
        '<button class="btn sec" data-entregar="' + esc(g.id) + '">Entregar</button>' +
        '<a class="btn sec" href="' + esc(g.carpeta) + '" target="_blank" rel="noopener">Abrir en Drive</a></div></article>';
    }).join('') || '<p class="s">Aún no hay galerías. Crea la primera.</p>';
  }

  function cargar(){
    return llamar({ accion: 'lista' }).then(function(d){
      if (!d.ok) { clave = ''; try { sessionStorage.removeItem('age-clave'); } catch(e) {} ver(true); $('#errLogin').textContent = 'La clave no es correcta.'; $('#errLogin').hidden = false; return; }
      galerias = d.galerias; ver(false); pintar();
    }).catch(function(){ $('#errLogin').textContent = 'No pude conectar. Revisa tu internet.'; $('#errLogin').hidden = false; ver(true); });
  }

  $('#entrar').addEventListener('click', function(){
    clave = $('#clave').value;
    try { sessionStorage.setItem('age-clave', clave); } catch(e) {}
    $('#errLogin').hidden = true;
    cargar();
  });
  $('#clave').addEventListener('keydown', function(e){ if (e.key === 'Enter') $('#entrar').click(); });
  $('#salir').addEventListener('click', function(){ clave = ''; try { sessionStorage.removeItem('age-clave'); } catch(e) {} $('#clave').value = ''; ver(true); });

  $('#nueva').addEventListener('click', function(){ $('#dNueva').showModal(); });
  $('#fNueva').addEventListener('submit', function(e){
    e.preventDefault();
    llamar({ accion: 'nueva', cliente: $('#nCliente').value, titulo: $('#nTitulo').value }).then(function(d){
      $('#dNueva').close();
      if (d.ok) { $('#nCliente').value = ''; $('#nTitulo').value = ''; cargar(); } else alert('No se pudo crear la galería.');
    });
  });

  function reducir(file){
    return createImageBitmap(file).then(function(b){
      var k = Math.min(1, 1600 / Math.max(b.width, b.height));
      var c = document.createElement('canvas');
      c.width = Math.round(b.width * k); c.height = Math.round(b.height * k);
      c.getContext('2d').drawImage(b, 0, 0, c.width, c.height);
      return new Promise(function(r){ c.toBlob(r, 'image/jpeg', 0.85); });
    });
  }
  function base64(blob){
    return new Promise(function(r){ var fr = new FileReader(); fr.onload = function(){ r(fr.result.split(',')[1]); }; fr.readAsDataURL(blob); });
  }

  $('#goSubir').addEventListener('click', function(){
    var files = Array.from($('#archivos').files), dest = document.querySelector('input[name=dest]:checked').value;
    if (!files.length) return;
    var btn = $('#goSubir'); btn.disabled = true; $('#prog').innerHTML = '';
    var cadena = Promise.resolve();
    files.forEach(function(f){
      var li = document.createElement('li'); li.textContent = f.name + ': esperando'; $('#prog').appendChild(li);
      cadena = cadena.then(function(){
        li.textContent = f.name + ': subiendo…';
        var nombre = f.name;
        var obtener = dest === 'seleccion'
          ? reducir(f).then(function(b){ nombre = f.name.replace(/\.[^.]+$/, '') + '.jpg'; return b; })
          : (f.size > 12e6 ? Promise.reject(new Error('pesa más de 12 MB, súbela directo a Drive')) : Promise.resolve(f));
        return obtener.then(function(blob){
          return base64(blob).then(function(datos){
            return llamar({ accion: 'subir', id: galActual, destino: dest, nombre: nombre, tipo: blob.type || 'image/jpeg', datos: datos });
          });
        }).then(function(d){ li.textContent = f.name + (d.ok ? ': lista' : ': error al guardar'); })
          .catch(function(e){ li.textContent = f.name + ': ' + (e.message || 'error'); });
      });
    });
    cadena.then(function(){ btn.disabled = false; $('#archivos').value = ''; });
  });

  document.addEventListener('click', function(e){
    var el;
    if (e.target.closest('[data-cerrar]')) { e.target.closest('dialog').close(); return; }
    if ((el = e.target.closest('[data-subir]'))) {
      galActual = el.getAttribute('data-subir');
      var g = galerias.filter(function(x){ return x.id === galActual; })[0];
      $('#tSubir').textContent = 'Subir fotos · ' + (g ? g.titulo : '');
      $('#prog').innerHTML = ''; $('#dSubir').showModal(); return;
    }
    if ((el = e.target.closest('[data-fav]'))) {
      llamar({ accion: 'favoritas', id: el.getAttribute('data-fav') }).then(function(d){
        $('#txtFav').value = d.ok ? (d.nombres.length ? d.nombres.join(', ') : 'Aún no hay favoritas.') : 'No se pudo leer.';
        $('#dFav').showModal();
      }); return;
    }
    if ((el = e.target.closest('[data-entregar]'))) {
      if (!confirm('¿Marcar como entregada? Se activan las descargas y se quita la marca de agua.')) return;
      llamar({ accion: 'entregar', id: el.getAttribute('data-entregar') }).then(function(){ cargar(); });
    }
  });
  $('#copiar').addEventListener('click', function(){
    $('#txtFav').select();
    try { navigator.clipboard.writeText($('#txtFav').value); } catch(e) { document.execCommand('copy'); }
  });

  if (clave) cargar(); else ver(true);
})();
</script>
</body>
</html>
