<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Tu galería</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--f:#FAF8F5;--t:#2B2623;--s:#7a7068;--l:#E6DFD6;--a:#B08968;--c:#fff;--err:#A32D2D;color-scheme:light}
:root[data-tema=dark]{--f:#151413;--t:#F1ECE4;--s:#a39a91;--l:#2c2926;--a:#C9A27A;--c:#1c1a18;--err:#E58C8C;color-scheme:dark}:root[data-tema=dark] .il{mix-blend-mode:normal!important;filter:none!important;border-radius:10px}
@media(prefers-color-scheme:dark){:root:not([data-tema=light]){--f:#151413;--t:#F1ECE4;--s:#a39a91;--l:#2c2926;--a:#C9A27A;--c:#1c1a18;--err:#E58C8C;color-scheme:dark}:root:not([data-tema=light]) .il{mix-blend-mode:normal!important;filter:none!important;border-radius:10px}}
:root[data-pal=blanco]{--f:#fff;--t:#111;--s:#6b6b6b;--l:#e8e8e8;--a:#111;--c:#fff;color-scheme:light}
:root[data-pal=beige]{--f:#F3EDE3;--t:#3a2f25;--s:#7b6d5f;--l:#ddd2c1;--a:#8A6A3B;--c:#faf6ee;color-scheme:light}
:root[data-pal=oliva]{--f:#F1EFE4;--t:#2f3320;--s:#6d7156;--l:#d9d6c3;--a:#6B7A3A;--c:#f8f6ec;color-scheme:light}
:root[data-pal=noche]{--f:#0F1B2D;--t:#EEF2F7;--s:#9fb0c6;--l:#223452;--a:#8FB4E3;--c:#162540;color-scheme:dark}
:root[data-pal=negro]{--f:#0B0B0B;--t:#F2F2F2;--s:#9a9a9a;--l:#262626;--a:#C9A27A;--c:#151515;color-scheme:dark}
:root[data-pal] .il{mix-blend-mode:normal!important;filter:none!important;border-radius:10px}
.rej.uniforme{columns:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}.rej.uniforme .f{margin:0;aspect-ratio:4/5!important}
.rej.amplio{columns:420px}
*{box-sizing:border-box;margin:0}[hidden]{display:none!important}
body{background:var(--f);color:var(--t);font-family:'Jost',system-ui,sans-serif;line-height:1.55;min-height:100vh;padding-bottom:env(safe-area-inset-bottom)}
h1,h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;line-height:1.1}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.il{mix-blend-mode:multiply;filter:contrast(1.04) brightness(1.05);max-width:100%;display:block;margin:0 auto}
.btn{background:var(--t);color:var(--f);border:1px solid var(--t);padding:.7rem 1.5rem;border-radius:999px;transition:opacity .2s}.btn:hover{opacity:.85}.btn.sec{background:none;color:var(--t);border-color:var(--l)}.btn:disabled{opacity:.5}
#acceso,#gracias{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:2rem 1.2rem;text-align:center}
#acceso .il,#gracias .il{width:min(14rem,60vw)}.logo{width:min(20rem,80vw)!important}
#acceso h1,#gracias h1{font-size:clamp(2rem,6vw,2.8rem)}
#fa{display:flex;flex-direction:column;gap:.7rem;width:min(22rem,100%)}
#cod{width:100%;padding:.8rem 1rem;border:1px solid var(--l);background:var(--c);border-radius:12px;text-align:center;letter-spacing:.15em;text-transform:uppercase}
.s{color:var(--s)}.err{color:var(--err);min-height:1.4em}
header.h{text-align:center;padding:2.2rem 1rem 1rem}header .e{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--s)}
header h1{font-size:clamp(2.2rem,6vw,3.4rem);margin:.3rem 0}
.tabs{display:flex;justify-content:center;gap:1.8rem;border-bottom:1px solid var(--l);margin:1.2rem 1rem 1.6rem;flex-wrap:wrap}
.tabs button{background:none;border:0;padding:.6rem 0;color:var(--s);border-bottom:2px solid transparent}.tabs button.on{color:var(--t);border-color:var(--a)}
.rej{columns:260px;column-gap:14px;padding:0 14px 6rem;max-width:1400px;margin:0 auto}
.f{position:relative;margin:0 0 14px;break-inside:avoid;background:var(--l);border-radius:6px;overflow:hidden}.f img{width:100%;height:100%;display:block;object-fit:cover;cursor:zoom-in}
.co{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:50%;border:1px solid var(--a);background:rgba(250,248,245,.92);display:grid;place-items:center;color:#2B2623}
.co svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8}.co[aria-pressed=true]{background:var(--a);color:#fff}.co[aria-pressed=true] svg{fill:currentColor}
.fin{margin:0 0 14px;break-inside:avoid;border:1px solid var(--l);border-radius:8px;overflow:hidden;background:var(--c)}.fin img{width:100%;display:block}.fin div{padding:.7rem .9rem;display:flex;justify-content:space-between;align-items:center;gap:.5rem;font-size:.85rem}
.fin a{text-decoration:none}.vacio{text-align:center;color:var(--s);padding:3rem 1rem;column-span:all}
.dl{position:absolute;right:10px;bottom:10px;width:42px;height:42px;border-radius:50%;background:var(--a);color:#fff;display:grid;place-items:center;text-decoration:none}.dl svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.masivo{column-span:all;text-align:center;margin:0 0 1.2rem}#visor .dlv{position:absolute;bottom:1rem;right:1rem;text-decoration:none;padding:.5rem 1.1rem}
#portada{position:fixed;top:0;left:0;right:0;height:100vh;height:100svh;z-index:20;display:grid;place-items:end center;color:#fff;text-align:center;overflow:hidden;background:#151413}
#portada>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#portada:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,.05) 60%)}
.pv{position:relative;z-index:1;padding:0 1.2rem 12vh}.pv h1{font-size:clamp(2.4rem,7vw,4.6rem);margin:.3rem 0}.pv .pe{letter-spacing:.22em;text-transform:uppercase;font-size:.8rem}.pv p{opacity:.85;margin:.3rem 0 1.6rem}
#portada .btn{background:#fff;color:#2B2623;border-color:#fff;padding:.8rem 2rem}
.pc{position:absolute;z-index:2;left:0;right:0;top:0;height:56px;display:flex;align-items:center;justify-content:center;gap:.8rem;opacity:0;pointer-events:none;font-family:'Cormorant Garamond',serif;font-size:1.25rem;white-space:nowrap;padding:0 1rem}.pc small{font-family:'Jost',sans-serif;letter-spacing:.2em;text-transform:uppercase;font-size:.65rem;opacity:.85}
#pspacer{height:100vh;height:100svh}
body.cp header.h .e,body.cp header.h h1,body.cp header.h #fec{display:none}body.cp header.h{padding-top:1rem}
#desc{max-width:34rem;margin:.4rem auto 0;color:var(--s)}
.barra{position:fixed;left:0;right:0;bottom:0;background:var(--c);border-top:1px solid var(--l);padding:.8rem 1rem calc(.8rem + env(safe-area-inset-bottom));display:flex;justify-content:center;align-items:center;gap:1.2rem;z-index:5}
dialog{border:1px solid var(--l);background:var(--f);color:var(--t);border-radius:16px;padding:1.5rem;width:min(26rem,92vw);margin:auto;box-shadow:0 24px 60px rgba(43,38,35,.25)}dialog::backdrop{background:rgba(21,20,19,.6)}
dialog h2{font-size:1.8rem;margin-bottom:.5rem}.fil{display:flex;gap:.6rem;margin-top:1.2rem;flex-wrap:wrap}
#visor{width:100vw;height:100vh;max-width:none;max-height:none;border:0;border-radius:0;padding:0;background:rgba(21,20,19,.96);margin:0}
#visor img{position:absolute;inset:3.5rem 3.5rem 3rem;width:calc(100% - 7rem);height:calc(100% - 6.5rem);object-fit:contain}
#visor .x,#visor .p,#visor .n{position:absolute;background:none;border:0;color:#F1ECE4;font-size:2rem;padding:.5rem 1rem}
#visor .x{top:.3rem;right:.5rem}#visor .p{left:0;top:50%}#visor .n{right:0;top:50%}
#visor .co{top:auto;bottom:1rem;right:50%;transform:translateX(50%)}#visor .nm{position:absolute;bottom:1.3rem;left:1rem;color:#a39a91;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:5rem;transform:translateX(-50%);background:var(--t);color:var(--f);padding:.7rem 1.2rem;border-radius:999px;z-index:60;font-size:.95rem}
@media(max-width:600px){#visor img{inset:3.2rem 0 4rem;width:100%;height:calc(100% - 7.2rem)}}
</style>
</head>
<body>

<main id="acceso">
  <picture><source media="(prefers-color-scheme: dark)" srcset="imagenes/logo-oscuro.png.jpg"><img class="il logo" data-n="logo-claro" data-i="0" src="imagenes/logo-claro.png.jpg" alt="Alexander Ge Erre"></picture>
  <h1>Entra a tu galería</h1>
  <p class="s">Escribe el código que te envié para ver tus fotos.</p>
  <form id="fa" autocomplete="off"><input id="cod" name="codigo-galeria" placeholder="Tu código" autocomplete="off" autocapitalize="characters" spellcheck="false"><p class="err" id="err" role="alert"></p><button class="btn" id="go" type="submit">Entrar a mi galería</button></form>
  <div id="ilErr"></div>
</main>

<section id="portada" hidden><img id="pimg" alt=""><div class="pc" id="pc"><small id="pcs"></small><span id="pct"></span></div><div class="pv" id="pvv"><div class="pe" id="pest"></div><h1 id="ptit"></h1><p id="pfec"></p><button class="btn" id="pver" type="button">Ver galería</button></div></section>

<div id="pspacer" hidden></div>
<section id="galeria" hidden>
  <header class="h"><div class="e" id="est"></div><h1 id="tit"></h1><p class="s" id="fec"></p><p id="desc"></p><p id="guia"></p><div style="display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap;margin-top:.8rem"><button class="btn sec" id="tema" type="button" style="padding:.3rem 1rem;font-size:.85rem">Tema: automático</button><button class="btn sec" id="salir" style="padding:.3rem 1rem;font-size:.85rem">Salir</button></div></header>
  <nav class="tabs" id="tabs"></nav>
  <div class="rej" id="rej"></div>
  <div class="barra" id="barra" hidden><span id="cnt"></span><button class="btn" id="enviar" type="button">Enviar selección</button></div>
</section>

<main id="gracias" hidden>
  <img class="il" data-n="admin-al-dia" data-i="0" src="imagenes/admin-al-dia.png.jpg" alt="">
  <h1>¡Gracias!</h1><p class="s" id="txtG"></p><button class="btn sec" id="volver" type="button">Volver a mis fotos</button>
</main>

<dialog id="visor"><button class="x" aria-label="Cerrar">×</button><button class="p" aria-label="Anterior">‹</button><button class="n" aria-label="Siguiente">›</button><img alt=""><button class="co" id="vco" aria-pressed="false" aria-label="Favorita"><svg viewBox="0 0 24 24"><path d="M12 21s-7-4.6-9.3-9.1C1.2 8.8 3 5.5 6.2 5.5c2 0 3.2 1.1 3.8 2.2h4c.6-1.1 1.8-2.2 3.8-2.2 3.2 0 5 3.3 3.5 6.4C19 16.4 12 21 12 21z" transform="translate(0 -1)"/></svg></button><span class="nm" id="vnm"></span><a class="btn dlv" id="vdl" href="#" hidden>Descargar</a></dialog>

<dialog id="conf"><h2>¿Enviar tu selección?</h2><p class="s" id="txtC"></p><div class="fil"><button class="btn" id="ok" type="button">Sí, enviar</button><button class="btn sec" id="no" type="button">Seguir eligiendo</button></div></dialog>

<script>
(function(){
  var W = 'https://galerias-api.alexandergeerre.workers.dev';
  var EXTS = ['.png.jpg', '.jpg.jpg', '.jpg', '.png', '.jpeg', '.webp', '.png.png'];
  var DESCARGA = '<svg viewBox="0 0 24 24"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>';
  var HEART = '<svg viewBox="0 0 24 24"><path d="M12 20.5s-7-4.4-9.2-8.9C1.3 8.5 3.1 5.3 6.2 5.3c2 0 3.2 1.1 3.8 2.2.6-1.1 1.8-2.2 3.8-2.2 3.1 0 4.9 3.2 3.4 6.3C19 16.1 12 20.5 12 20.5z"/></svg>';
  function $(s){ return document.querySelector(s); }
  function esc(t){ return String(t == null ? '' : t).replace(/[&<>"]/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function leer(k){ try { return localStorage.getItem(k) || ''; } catch(e) { return ''; } }
  function escribir(k, v){ try { if (v) localStorage.setItem(k, v); else localStorage.removeItem(k); } catch(e) {} }
  function token(){ var a = new Uint8Array(24); crypto.getRandomValues(a); return Array.prototype.map.call(a, function(b){ return ('0' + b.toString(16)).slice(-2); }).join(''); }
  var visitor = leer('age-visitante'); if (!/^[A-Za-z0-9-]{16,64}$/.test(visitor)) { visitor = token(); escribir('age-visitante', visitor); }
  document.addEventListener('error', function(e){
    var t = e.target; if (!t || t.tagName !== 'IMG' || !t.dataset.n) return;
    var i = +t.dataset.i + 1;
    if (i < EXTS.length) { t.dataset.i = i; t.src = 'imagenes/' + t.dataset.n + EXTS[i]; } else t.style.visibility = 'hidden';
  }, true);
  function ilus(n){ return '<img class="il" data-n="' + n + '" data-i="0" src="imagenes/' + n + EXTS[0] + '" alt="">'; }
  function post(path, body){ return fetch(W + path, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function(r){ return r.text().then(function(t){ try { return JSON.parse(t); } catch(e) { throw new Error('respuesta inesperada, código ' + r.status); } }); }); }
  function url(t, dl){ return W + '/api/img?t=' + encodeURIComponent(t) + (dl ? '&dl=1' : ''); }
  function aviso(t){ var d = document.createElement('div'); d.className = 'toast'; d.textContent = t; document.body.appendChild(d); setTimeout(function(){ d.remove(); }, 4000); }
  function fechaLarga(s){
    var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s || ''); if (!m) return '';
    var ms = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
    return parseInt(m[3], 10) + ' de ' + ms[parseInt(m[2], 10) - 1] + ' de ' + m[1];
  }
  function base(n){ return String(n || '').replace(/\.[^.]+$/, '').toLowerCase(); }
  var conPortada = false;
  function ajustarPortada(){
    if (!conPortada) return;
    var vh = window.innerHeight, p = Math.min(1, window.scrollY / (vh * 0.7)), bar = 56;
    $('#portada').style.height = (vh - p * (vh - bar)) + 'px';
    $('#pvv').style.opacity = Math.max(0, 1 - p * 2.2);
    $('#pc').style.opacity = Math.max(0, (p - 0.6) / 0.4);
  }
  window.addEventListener('scroll', ajustarPortada, { passive: true }); window.addEventListener('resize', ajustarPortada);
  function mostrar(id){
    ['acceso', 'galeria', 'gracias'].forEach(function(x){ $('#' + x).hidden = x !== id; });
    var pc = conPortada && id === 'galeria'; $('#portada').hidden = !pc; $('#pspacer').hidden = !pc; document.body.classList.toggle('cp', pc);
    if (id === 'acceso') document.documentElement.removeAttribute('data-pal');
    window.scrollTo(0, 0); ajustarPortada();
  }

  var codigo = '', G = null, E = null, fotos = [], favs = new Set(), tab = 'todas', lista = [], vi = 0;
  function sel(){ return fotos.filter(function(f){ return f.tipo === 'selection'; }); }
  function fin(){ return fotos.filter(function(f){ return f.tipo === 'final'; }); }
  function puede(){ return G && G.seleccion; }

  function portadaFoto(){ var s = sel(), f = fin(), id = G && G.portada, x; if (G && G.estado === 'delivered' && f.length) return f[0]; if (id) { x = s.filter(function(q){ return q.id === id; })[0]; if (x) return x; } return s[0] || null; }
  function temaC(){ return leer('age-tema') || 'auto'; }
  function aplicarTemaC(){
    var t = temaC(); if (t === 'auto') document.documentElement.removeAttribute('data-tema'); else document.documentElement.setAttribute('data-tema', t);
    $('#tema').textContent = { auto: 'Tema: automático', light: 'Tema: claro', dark: 'Tema: oscuro' }[t];
  }
  $('#tema').addEventListener('click', function(){ var n = { auto: 'light', light: 'dark', dark: 'auto' }[temaC()]; escribir('age-tema', n === 'auto' ? '' : n); aplicarTemaC(); });
  $('#pver').addEventListener('click', function(){ window.scrollTo({ top: $('#galeria').getBoundingClientRect().top + window.scrollY - 56, behavior: 'smooth' }); });
  aplicarTemaC();

  function abrir(c, silencioso){
    c = (c || '').trim(); if (!c) return;
    var btn = $('#go'); btn.disabled = true; btn.textContent = 'Entrando…'; $('#err').textContent = ''; $('#ilErr').innerHTML = '';
    post('/api/client/open', { code: c, visitor: visitor }).then(function(d){
      if (!d.ok) {
        if (silencioso) { escribir('age-codigo-cliente', ''); return; }
        var exp = d.error === 'expirada';
        $('#err').textContent = exp ? 'Esta galería ya expiró. Escríbeme y la reactivo.' : d.error === 'sin_publicar' ? 'Esta galería todavía no está publicada.' : d.error === 'servidor' ? 'La galería tuvo un problema técnico (servidor). Inténtalo en unos minutos.' : 'El código no es correcto. Revisa que esté escrito igual que te lo envié.';
        $('#ilErr').innerHTML = ilus(exp ? 'galeria-expirada' : 'enlace-no-valido'); return;
      }
      codigo = c; escribir('age-codigo-cliente', c);
      G = d.galeria; E = d.estudio; fotos = d.fotos || []; favs = new Set(d.favoritas || []); tab = G.estado === 'delivered' && fin().length ? 'finales' : 'todas';
      document.title = G.titulo;
      $('#est').textContent = E && E.studio_name ? E.studio_name : '';
      $('#tit').textContent = G.titulo; $('#fec').textContent = fechaLarga(G.fecha);
      $('#guia').textContent = G.estado === 'delivered' ? 'Tus fotos finales ya están listas. Descárgalas en la pestaña Fotos finales.' : puede() ? 'Toca el corazón en tus fotos favoritas y luego envía tu selección.' : '';
      $('#desc').textContent = [G.tipo, G.ubicacion, G.descripcion].filter(Boolean).join(' · ');
      if (G.paleta && G.paleta !== 'auto') document.documentElement.setAttribute('data-pal', G.paleta); else document.documentElement.removeAttribute('data-pal');
      $('#rej').className = 'rej ' + (G.estilo || 'clasico');
      pintar();
      var pf = portadaFoto();
      if (pf) {
        $('#pimg').src = url(pf.t); $('#pest').textContent = E && E.studio_name ? E.studio_name : '';
        $('#ptit').textContent = G.titulo; $('#pfec').textContent = fechaLarga(G.fecha);
        $('#pcs').textContent = E && E.studio_name ? E.studio_name : ''; $('#pct').textContent = G.titulo; conPortada = true;
      } else conPortada = false;
      mostrar('galeria');
    }).catch(function(e){ if (!silencioso) $('#err').textContent = 'No pude conectar (' + (e && e.message ? e.message : 'error') + '). Revisa tu internet e inténtalo de nuevo.'; })
      .then(function(){ btn.disabled = false; btn.textContent = 'Entrar a mi galería'; });
  }

  function tarjeta(f){
    var r = f.ancho && f.alto ? f.ancho + ' / ' + f.alto : '3 / 2';
    var co = puede() ? '<button class="co" data-fav="' + f.id + '" aria-pressed="' + favs.has(f.id) + '" aria-label="Favorita">' + HEART + '</button>' : '';
    return '<figure class="f" style="aspect-ratio:' + r + '"><img loading="lazy" data-ver="' + f.id + '" alt="" src="' + esc(url(f.t)) + '">' + co + '</figure>';
  }
  function tarjetaFinal(f){
    var r = f.ancho && f.alto ? f.ancho + ' / ' + f.alto : '3 / 2';
    return '<figure class="f" style="aspect-ratio:' + r + '"><img loading="lazy" data-ver="' + f.id + '" alt="" src="' + esc(url(f.t)) + '">' + (G.descargas ? '<a class="dl" href="' + esc(url(f.t, true)) + '" download aria-label="Descargar">' + DESCARGA + '</a>' : '') + '</figure>';
  }
  function pintar(){
    var s = sel(), fn = fin(), mias = s.filter(function(f){ return favs.has(f.id); });
    var tabs = [['todas', 'Todas ' + s.length]];
    if (puede() || favs.size) tabs.push(['favoritas', 'Mis favoritas ' + mias.length]);
    if (G.estado === 'delivered') tabs.push(['finales', 'Fotos finales ' + fn.length]);
    $('#tabs').innerHTML = tabs.map(function(t){ return '<button data-tab="' + t[0] + '"' + (tab === t[0] ? ' class="on"' : '') + '>' + t[1] + '</button>'; }).join('');
    var h = '';
    if (tab === 'todas') { lista = s; h = s.length ? s.map(tarjeta).join('') : '<p class="vacio">Pronto verás aquí tus fotos.</p>'; }
    else if (tab === 'favoritas') { lista = mias; h = mias.length ? mias.map(tarjeta).join('') : '<p class="vacio">Aún no tienes favoritas. Toca el corazón en las fotos que más te gusten.</p>'; }
    else {
      lista = fn;
      h = fn.length ? (G.descargas ? '<div class="masivo"><button class="btn" id="dtodas" type="button">Descargar todas</button></div>' : '') + fn.map(tarjetaFinal).join('') : '<p class="vacio">Tus fotos finales aparecerán aquí.</p>';
    }
    $('#rej').innerHTML = h;
    $('#barra').hidden = !puede();
    $('#cnt').textContent = favs.size + (favs.size === 1 ? ' favorita' : ' favoritas');
    $('#enviar').disabled = !favs.size;
  }

  function poner(id, on){
    if (on) favs.add(id); else favs.delete(id);
    document.querySelectorAll('[data-fav="' + id + '"]').forEach(function(b){ b.setAttribute('aria-pressed', on); });
    $('#vco').setAttribute('aria-pressed', lista[vi] && favs.has(lista[vi].id));
    $('#cnt').textContent = favs.size + (favs.size === 1 ? ' favorita' : ' favoritas'); $('#enviar').disabled = !favs.size;
    var m = sel().filter(function(f){ return favs.has(f.id); }).length;
    var tb = document.querySelector('[data-tab="favoritas"]'); if (tb) tb.textContent = 'Mis favoritas ' + m;
  }
  function alternar(id){
    var on = !favs.has(id); poner(id, on);
    post('/api/client/favorite', { code: codigo, visitor: visitor, photo: id, active: on }).then(function(d){
      if (!d.ok) throw new Error(d.error);
    }).catch(function(e){
      poner(id, !on);
      aviso(e && e.message === 'cerrada' ? 'Tu selección ya está cerrada.' : 'No se pudo guardar tu favorita. Inténtalo de nuevo.');
    });
  }

  var visor = $('#visor');
  function verFoto(i){
    if (!lista.length) return; vi = (i + lista.length) % lista.length; var f = lista[vi];
    visor.querySelector('img').src = url(f.t); $('#vnm').textContent = f.nombre;
    var c = $('#vco'); c.hidden = !puede(); c.dataset.fav = f.id; c.setAttribute('aria-pressed', favs.has(f.id));
    var dv = $('#vdl'); dv.hidden = !(G.descargas && f.tipo === 'final'); if (!dv.hidden) dv.href = url(f.t, true);
  }
  document.addEventListener('click', function(e){
    var t = e.target, el;
    if ((el = t.closest('#visor .co'))) { alternar(lista[vi].id); return; }
    if ((el = t.closest('.co[data-fav]'))) { alternar(el.dataset.fav); return; }
    if (t.closest('#dtodas')) {
      fin().forEach(function(f, i){ setTimeout(function(){ var a = document.createElement('a'); a.href = url(f.t, true); a.download = ''; document.body.appendChild(a); a.click(); a.remove(); }, i * 700); });
      aviso('Iniciando las descargas. Si tu navegador pregunta, permite descargas múltiples.'); return;
    }
    if ((el = t.closest('[data-tab]'))) { tab = el.dataset.tab; pintar(); return; }
    if ((el = t.closest('.f img'))) { var id = el.dataset.ver; for (var i = 0; i < lista.length; i++) if (lista[i].id === id) { verFoto(i); visor.showModal(); break; } return; }
    if (t.closest('#visor .x')) visor.close();
    if (t.closest('#visor .p')) verFoto(vi - 1);
    if (t.closest('#visor .n')) verFoto(vi + 1);
  });
  document.addEventListener('keydown', function(e){ if (!visor.open) return; if (e.key === 'ArrowLeft') verFoto(vi - 1); if (e.key === 'ArrowRight') verFoto(vi + 1); });

  $('#enviar').addEventListener('click', function(){ $('#txtC').textContent = 'Voy a recibir tus ' + favs.size + (favs.size === 1 ? ' foto favorita' : ' fotos favoritas') + '. Podrás cambiarla mientras yo no empiece a editar.'; $('#conf').showModal(); });
  $('#no').addEventListener('click', function(){ $('#conf').close(); });
  $('#ok').addEventListener('click', function(){
    $('#conf').close();
    post('/api/client/send', { code: codigo, visitor: visitor }).then(function(d){
      if (!d.ok) throw new Error(d.error);
      $('#txtG').textContent = 'Recibí tus ' + d.cantidad + (d.cantidad === 1 ? ' foto' : ' fotos') + '. Voy a editarlas y te aviso cuando estén listas.';
      mostrar('gracias');
    }).catch(function(){ aviso('No se pudo enviar tu selección. Inténtalo de nuevo.'); });
  });
  $('#volver').addEventListener('click', function(){ mostrar('galeria'); });
  $('#salir').addEventListener('click', function(){ escribir('age-codigo-cliente', ''); codigo = ''; $('#cod').value = ''; history.replaceState(null, '', location.pathname); mostrar('acceso'); });
  $('#fa').addEventListener('submit', function(e){ e.preventDefault(); abrir($('#cod').value); });

  var p = new URLSearchParams(location.search).get('c') || leer('age-codigo-cliente');
  if (p) { $('#cod').value = p; abrir(p, !new URLSearchParams(location.search).get('c')); }
})();
</script>
</body>
</html>
